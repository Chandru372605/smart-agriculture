services:
  - type: web
    name: agrosense
    env: python
    region: singapore     # Closest to India
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120 --log-level info
    envVars:
      - key: WEATHER_API_KEY
        sync: false        # You'll paste this on Render dashboard
      - key: DATAGOV_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random value
      - key: FLASK_DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.0
