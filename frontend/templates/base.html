<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AgroSense — Smart Agriculture AI{% endblock %}</title>
  <meta name="description"
    content="{% block meta_description %}AgroSense is an AI-powered smart agriculture platform with 8 integrated ML modules for crop recommendation, disease detection, yield prediction and more.{% endblock %}" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- AgroSense Stylesheet -->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />

  {% block head_extra %}{% endblock %}
</head>

<body>

  <!-- ════════════════════════════════════════
     NAVBAR
════════════════════════════════════════ -->
  <nav class="nav-bar" role="navigation" aria-label="Main navigation">
    <div class="nav-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-dot"></span>AgroSense
      </a>
      <a id="nav-home" class="nav-item" href="{{ url_for('index') }}"><span class="nav-icon">🏠</span>Home</a>
      <a id="nav-crop" class="nav-item" href="{{ url_for('crop_recommendation') }}"><span class="nav-icon">🌾</span>Crop
        Rec.</a>
      <a id="nav-disease" class="nav-item" href="{{ url_for('disease_detection') }}"><span
          class="nav-icon">🔬</span>Disease</a>
      <a id="nav-irrigation" class="nav-item" href="{{ url_for('irrigation') }}"><span
          class="nav-icon">💧</span>Irrigation</a>
      <a id="nav-yield" class="nav-item" href="{{ url_for('yield_prediction') }}"><span
          class="nav-icon">📊</span>Yield</a>
      <a id="nav-rotation" class="nav-item" href="{{ url_for('crop_rotation') }}"><span
          class="nav-icon">🔄</span>Rotation</a>
      <a id="nav-pest" class="nav-item" href="{{ url_for('pest_risk') }}"><span class="nav-icon">🐛</span>Pest Risk</a>
      <a id="nav-profit" class="nav-item" href="{{ url_for('profit_estimator') }}"><span
          class="nav-icon">💰</span>Profit</a>
      <a id="nav-market" class="nav-item" href="{{ url_for('market_price') }}"><span
          class="nav-icon">📈</span>Market</a>
    </div>
  </nav>

  <!-- TOAST CONTAINER -->
  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <!-- PAGE CONTENT -->
  <main class="page-wrap">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AgroSense JS (simulation fallback) -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <!-- Live API connector — overrides simulations with real Flask predictions -->
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>

  {% block scripts_extra %}{% endblock %}
</body>

</html>
